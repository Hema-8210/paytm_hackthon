version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: skillpath_db
    restart: always
    environment:
      POSTGRES_USER: skillpath
      POSTGRES_PASSWORD: skillpath_password
      POSTGRES_DB: skillpath_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillpath_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://skillpath:skillpath_password@db:5432/skillpath_db
      - JWT_SECRET=production-secret-key-change-this-in-env
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillpath_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
